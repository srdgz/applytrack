name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Reglas de arquitectura
        run: pnpm depcruise

      - name: Build
        run: pnpm build

  commits:
    name: Commits convencionales
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  supabase:
    name: Base de datos y adaptador de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Arrancar Supabase local
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,postgres-meta,supavisor,mailpit

      - name: Revisar la migración
        run: pnpm exec supabase db lint --level warning --fail-on warning

      - name: Claves de la instancia local
        run: |
          pnpm exec supabase status -o json > supabase-status.json
          node -e '
            const status = JSON.parse(require("node:fs").readFileSync("supabase-status.json", "utf8"));
            console.log("SUPABASE_TEST_URL=" + status.API_URL);
            console.log("SUPABASE_TEST_PUBLISHABLE_KEY=" + status.ANON_KEY);
            console.log("SUPABASE_TEST_SECRET_KEY=" + status.SERVICE_ROLE_KEY);
          ' >> "$GITHUB_ENV"

      - name: Contrato y RLS
        run: pnpm --filter @applytrack/adapter-supabase test

  e2e:
    name: E2E, accesibilidad y capturas de la web
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @applytrack/web exec playwright install --with-deps chromium

      - name: E2E y axe en los 4 tamaños
        run: pnpm --filter @applytrack/web e2e

      - name: Capturas de referencia
        if: always()
        run: pnpm --filter @applytrack/web screenshots

      - name: Informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/screenshots
          retention-days: 14

  lighthouse:
    name: Rendimiento de la web
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @applytrack/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @applytrack/web build

      - name: Presupuesto de JavaScript
        run: pnpm --filter @applytrack/web size

      - name: Lighthouse
        run: pnpm --filter @applytrack/web lighthouse

      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 14
