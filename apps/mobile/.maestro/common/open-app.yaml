appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
          optional: true
- extendedWaitUntil:
    visible: "Probar sin cuenta|Try without an account"
    timeout: 120000
