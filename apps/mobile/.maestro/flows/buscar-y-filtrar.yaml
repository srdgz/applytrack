appId: host.exp.exponent
name: Buscar y filtrar
---
- runFlow: ../common/start-demo.yaml
- tapOn: "Lista"
- tapOn: "Buscar"
- inputText: "nordica"
- extendedWaitUntil:
    visible: "Nórdica Media"
    timeout: 10000
- assertNotVisible: "Nimbus Labs"
- tapOn: "Borrar búsqueda"
- tapOn: "Filtros"
- tapOn:
    text: "Oferta"
    below: "Estado"
- tapOn: "Listo"
- assertVisible: 'Filtros \(1\)'
- assertVisible: "Mostrando 1 de 1"
- assertVisible: "Tejo Cloud"
